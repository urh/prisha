<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e121a" media="(prefers-color-scheme: dark)" />
    <title>מצב פיננסי</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Runtime Tailwind config (the CDN build reads this object; no config file).
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              // Inter first for Latin/numerals, Heebo for Hebrew (Inter has no
              // Hebrew glyphs, so Hebrew falls through automatically).
              sans: ['Inter', 'Heebo', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      /* Privacy blur — lives in <head> so net worth is never visible even for a
         frame before React mounts. Keyed to body.privacy-on + .sensitive. */
      body.privacy-on .sensitive{filter:blur(12px) !important;-webkit-filter:blur(12px) !important;user-select:none !important;pointer-events:none !important}

      /* Tabular figures for all numerals — columns of ₪ amounts align. */
      body { font-variant-numeric: tabular-nums; }

      /* Linear's typographic signature: aggressive negative tracking that
         grows with size (-3px at 80px ≈ 4%), and a single family voice from
         display down to body. Applied by size class so it reaches the big
         ₪ figures without touching Hebrew body copy, which needs normal
         tracking to stay legible. */
      .text-5xl { letter-spacing: -0.035em; }
      .text-4xl { letter-spacing: -0.032em; }
      .text-3xl { letter-spacing: -0.028em; }
      .text-2xl { letter-spacing: -0.024em; }
      .text-xl  { letter-spacing: -0.020em; }
      .text-lg  { letter-spacing: -0.014em; }
      /* Eyebrows/labels take POSITIVE tracking — Linear uses the contrast
         against negative-tracked display type to mark taxonomy. */
      .uppercase { letter-spacing: 0.06em; }
    </style>
    <!-- ===================================================================
         Design primitives — Linear (linear.app) design system.
         Source: VoltAgent/awesome-design-md → design-md/linear.app/DESIGN.md

         Tokens as documented there:
           canvas #010102 · surface-1 #0f1011 · surface-2 #141516
           surface-3 #18191a · surface-4 #23252a
           hairline #23252a · hairline-strong #34343a · hairline-tertiary #3e3e44
           ink #f7f8f8 · ink-muted #d0d6e0 · ink-subtle #8a8f98 · ink-tertiary #62666d
           primary #5e6ad2 · primary-hover #828fff · primary-focus #5e69d1
           success #27a644 · inverse-canvas #ffffff · inverse-surface #f6f7f7/#f5f6f6

         Two Linear principles drive the look, beyond the palette:
           1. "Depth is carried by surface ladder + hairline borders. The brand
              resists drop shadows on dark almost entirely."  → shadows are
              neutralised in dark mode; separation comes from the ladder.
           2. "The dark canvas IS the whitespace."  → cards lift onto surface-1
              rather than being separated by gutters.

         This is a token layer over the Tailwind CDN utilities, so no JSX
         changed. !important is required because the CDN injects its own
         <style> after this one. Every selector the dark override had before is
         still here — src/test/darkModeCoverage.test.ts enforces that.
         ==================================================================== -->
    <style>
      /* ---------- LIGHT (Linear's inverse surfaces) ---------- */
      @media (prefers-color-scheme: light) {
        body, .min-h-screen { background-color: #f6f7f7 !important; }
        .bg-slate-50 { background-color: #f5f6f6 !important; }
        .text-slate-800, .text-black { color: #08090a !important; }
        /* Accent: Linear lavender-blue replaces Tailwind's blue. */
        .text-blue-700 { color: #3a4658 !important; }
        .text-blue-600, .text-blue-500 { color: #4a5870 !important; }
        .bg-blue-50, .bg-blue-50\/60 { background-color: #f2f3f5 !important; }
        .bg-blue-100 { background-color: #e6e8ec !important; }
        .border-blue-100, .border-blue-200 { border-color: #d5d8de !important; }
        .hover\:text-blue-500:hover, .hover\:text-blue-600:hover { color: #4a5870 !important; }
        .hover\:text-blue-700:hover { color: #3a4658 !important; }
        .accent-slate-600 { accent-color: #4a5870 !important; }
      }

      /* ---------- DARK (Linear's native mode) ---------- */
      @media (prefers-color-scheme: dark) {
        html { color-scheme: dark; }
        body, .min-h-screen { background-color: #0e121a !important; }

        /* surfaces — the ladder */
        .bg-white { background-color: #151a23 !important; }
        .bg-slate-50 { background-color: #0e121a !important; }
        .bg-slate-100 { background-color: #1a2029 !important; }
        .bg-slate-200 { background-color: #1f2630 !important; }
        .bg-slate-400 { background-color: #353e4b !important; }
        .bg-slate-800, .bg-slate-900 { background-color: #29303b !important; }
        .bg-gray-200 { background-color: #29303b !important; }
        .bg-slate-50\/60 { background-color: rgba(1,1,2,0.6) !important; }

        /* Linear resists shadows on dark — depth is the ladder + hairlines. */
        .shadow-sm, .shadow, .shadow-md, .shadow-lg, .shadow-xl, .shadow-2xl {
          box-shadow: none !important;
        }
        /* Faint top-edge highlight on lifted panels — the spec's "pixel
           rendered" feel that replaces the shadow. */
        .bg-white { box-shadow: inset 0 1px 0 rgba(255,255,255,0.04) !important; }

        /* hover/focus surface states (match their base remaps) */
        .hover\:bg-white:hover { background-color: #1a2029 !important; }
        .focus\:bg-white:focus { background-color: #1a2029 !important; }
        .hover\:bg-slate-50:hover { background-color: #151a23 !important; }
        .hover\:bg-slate-100:hover { background-color: #1f2630 !important; }
        .hover\:bg-slate-200:hover { background-color: #29303b !important; }
        .hover\:bg-slate-800:hover { background-color: #353e4b !important; }
        .hover\:bg-blue-100:hover { background-color: rgba(140,150,170,0.24) !important; }
        .hover\:bg-rose-100:hover { background-color: rgba(180,140,145,0.20) !important; }
        .hover\:bg-emerald-100:hover { background-color: rgba(110,140,120,0.22) !important; }

        /* hover/focus text + border states */
        .hover\:text-slate-600:hover { color: #c9d1dc !important; }
        .hover\:text-blue-500:hover, .hover\:text-blue-600:hover { color: #b4bcc8 !important; }
        .hover\:text-blue-700:hover { color: #c5cad3 !important; }
        .hover\:text-red-500:hover { color: #c4a0a0 !important; }
        .hover\:border-slate-100:hover { border-color: #353e4b !important; }
        .hover\:border-slate-200:hover, .focus\:border-slate-200:focus { border-color: #3f4957 !important; }
        .hover\:border-blue-200:hover { border-color: rgba(140,150,170,0.45) !important; }

        /* text — the ink ladder */
        .text-slate-800, .text-black { color: #e9edf3 !important; }
        .text-slate-700 { color: #c9d1dc !important; }
        .text-slate-600 { color: #aab3c0 !important; }
        .text-slate-500 { color: #8b95a5 !important; }
        .text-slate-400 { color: #7d8797 !important; }
        .text-slate-300 { color: #606a7a !important; }
        .text-slate-200 { color: #4b5464 !important; }

        /* borders — hairlines */
        .border-slate-50 { border-color: #1c222c !important; }
        .border-slate-100 { border-color: #29303b !important; }
        .border-slate-200 { border-color: #353e4b !important; }
        .border-white { border-color: #29303b !important; }
        .border-gray-300 { border-color: #3f4957 !important; }

        /* accent text — Linear lavender for blue/indigo, muted rest */
        .text-emerald-700 { color: #9aafa2 !important; }
        .text-emerald-600, .text-emerald-500 { color: #8aa394 !important; }
        .text-emerald-400 { color: #9aafa2 !important; }
        .text-blue-700 { color: #c5cad3 !important; }
        .text-blue-600, .text-blue-500 { color: #b4bcc8 !important; }
        .text-rose-700 { color: #c9a8ae !important; }
        .text-rose-600, .text-rose-500 { color: #c0989e !important; }
        .text-red-700 { color: #c9aaaa !important; }
        .text-red-500 { color: #c4a0a0 !important; }
        .text-amber-700 { color: #cbb892 !important; }
        .text-amber-600 { color: #c4ae84 !important; }
        .text-amber-500 { color: #c4ae84 !important; }
        .text-sky-700 { color: #b3c4cc !important; }
        .text-sky-600 { color: #9eb3bd !important; }
        .text-indigo-700 { color: #c5cad3 !important; }
        .text-indigo-600, .text-indigo-500 { color: #b4bcc8 !important; }
        .text-purple-600, .text-purple-500 { color: #b7b0c4 !important; }
        .text-violet-600 { color: #b7b0c4 !important; }
        .text-violet-700 { color: #c8c4d0 !important; }
        .text-orange-600 { color: #c9aa96 !important; }

        /* accent fills — Linear keeps these very subtle on dark */
        .bg-emerald-50 { background-color: rgba(110,140,120,0.12) !important; }
        .bg-emerald-100 { background-color: rgba(110,140,120,0.20) !important; }
        .bg-blue-50, .bg-blue-50\/60 { background-color: rgba(140,150,170,0.14) !important; }
        .bg-blue-100 { background-color: rgba(140,150,170,0.24) !important; }
        .bg-rose-50 { background-color: rgba(180,140,145,0.12) !important; }
        .bg-rose-100 { background-color: rgba(180,140,145,0.20) !important; }
        .bg-amber-50 { background-color: rgba(180,165,130,0.12) !important; }
        .bg-amber-100 { background-color: rgba(180,165,130,0.20) !important; }
        .bg-amber-50\/50 { background-color: rgba(180,165,130,0.10) !important; }
        .bg-sky-50 { background-color: rgba(140,160,170,0.12) !important; }
        .bg-sky-100 { background-color: rgba(140,160,170,0.20) !important; }
        .bg-sky-50\/50 { background-color: rgba(140,160,170,0.10) !important; }
        .bg-indigo-50 { background-color: rgba(140,150,170,0.12) !important; }
        .bg-purple-50 { background-color: rgba(160,155,175,0.12) !important; }
        .bg-violet-50 { background-color: rgba(140,135,155,0.12) !important; }
        .bg-red-50 { background-color: rgba(180,145,145,0.12) !important; }

        /* accent borders — hairline weight, brand-tinted */
        .border-emerald-100, .border-emerald-200 { border-color: rgba(110,140,120,0.28) !important; }
        .border-blue-100, .border-blue-200 { border-color: rgba(140,150,170,0.35) !important; }
        .border-amber-100, .border-amber-200 { border-color: rgba(180,165,130,0.28) !important; }
        .border-rose-100, .border-rose-200 { border-color: rgba(180,140,145,0.28) !important; }
        .border-red-200 { border-color: rgba(180,145,145,0.28) !important; }
        .border-purple-100 { border-color: rgba(160,155,175,0.28) !important; }
        .border-violet-100 { border-color: rgba(140,135,155,0.28) !important; }
        .border-indigo-100 { border-color: rgba(140,150,170,0.28) !important; }
        .border-sky-100 { border-color: rgba(140,160,170,0.28) !important; }

        /* Saturated fills used as solid card/badge backgrounds. These are
           exempt from the dark-mode coverage test (they read fine on dark),
           but Tailwind's hues are louder than anything in Linear's palette —
           retuning them is what stops the accent cards shouting over the
           near-black canvas. */
        .bg-emerald-700 { background-color: #3f6550 !important; }
        .bg-emerald-600 { background-color: #4e7562 !important; }
        .bg-emerald-500 { background-color: #5f8a72 !important; }
        .bg-blue-700 { background-color: #6d7c96 !important; }
        .bg-blue-600 { background-color: #7d8ba3 !important; }
        .bg-blue-500 { background-color: #8d9aaf !important; }
        /* Ring/border colour only — never background. An earlier pass set
           background-color here too, which silently overrode the background of
           any element carrying both a bg-* and a ring-* class. */
        .ring-emerald-500 { --tw-ring-color: rgba(110,140,120,0.55) !important; }
        .border-blue-500 { border-color: #7d8ba3 !important; }
        .bg-indigo-600 { background-color: #7d8ba3 !important; }
        .bg-purple-600 { background-color: #8d7ea0 !important; }
        .bg-rose-600 { background-color: #b88890 !important; }
        .bg-rose-500 { background-color: #c0989e !important; }
        .bg-amber-600 { background-color: #c4ae84 !important; }

        /* form controls — 8px radius and the lavender focus ring per the spec */
        input, select, textarea { color: #e9edf3 !important; }
        input:focus-visible, select:focus-visible, textarea:focus-visible {
          outline: 2px solid rgba(120,130,150,0.45) !important;
          outline-offset: 1px !important;
        }
        .accent-slate-600 { accent-color: #7d8ba3 !important; }

        /* recharts axes/grid/tooltip */
        .recharts-text { fill: #8b95a5 !important; }
        .recharts-cartesian-grid line,
        .recharts-cartesian-axis-line,
        .recharts-cartesian-axis-tick-line { stroke: #29303b !important; }
        .recharts-default-tooltip { background-color: #1a2029 !important; border-color: #353e4b !important; }
        .recharts-default-tooltip .recharts-tooltip-label { color: #e9edf3 !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
